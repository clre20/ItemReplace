name: ItemReplace
version: '${project.version}'
main: clre20.itemReplace.ItemReplace
api-version: '26.1'
author: Clre20
description: 將世界中的指定物品被動替換成其他物品（支援含 NBT／資料元件的物品）
website: https://github.com/clre20/ItemReplace

commands:
  itemreplace:
    description: ItemReplace 主指令
    usage: /<command> help
    aliases: [ir]

permissions:
  itemreplace.admin:
    description: 所有管理權限（不含 itemreplace.bypass）
    default: op
    children:
      itemreplace.help: true
      itemreplace.gui: true
      itemreplace.list: true
      itemreplace.create: true
      itemreplace.edit: true
      itemreplace.remove: true
      itemreplace.toggle: true
      itemreplace.reload: true
      itemreplace.version: true
  itemreplace.help:
    description: 查看指令說明
    default: op
  itemreplace.gui:
    description: 開啟規則介面
    default: op
  itemreplace.list:
    description: 列出所有規則
    default: op
  itemreplace.create:
    description: 建立規則
    default: op
  itemreplace.edit:
    description: 編輯規則
    default: op
  itemreplace.remove:
    description: 刪除規則
    default: op
  itemreplace.toggle:
    description: 啟用或停用規則
    default: op
  itemreplace.reload:
    description: 重新載入設定檔
    default: op
  itemreplace.version:
    description: 檢查更新，並在登入時收到新版本提醒
    default: op
  itemreplace.bypass:
    description: 持有者的物品不會被替換（OP 預設也沒有，需要另外給）
    default: false

softdepend: [ HttpHub ]
