# ItemReplace 訊息檔
# 缺少的項目會在啟動與 /itemreplace reload 時自動補齊，原本的文字會保留。
# 顏色可用 MiniMessage（<red>、<#FF5555>、<bold>）或 & 色碼（&a、&l、&#FF5555）。
# {名稱} 是變數，會換成實際內容；不需要的變數可以直接刪掉。
# 把文字改成 "" 可以關閉那則聊天訊息。

prefix: "<gray>[<aqua>ItemReplace</aqua>]</gray> "

general:
  no-permission: "{prefix}<red>你沒有權限這麼做。"
  player-only: "{prefix}<red>這個指令只能由玩家使用。"
  unknown-command: "{prefix}<red>沒有這個指令，輸入 /{label} help 查看說明。"
  usage: "{prefix}<red>用法：/{label} {usage}"
  invalid-id: "{prefix}<red>名稱只能用英文小寫、數字、_ 和 -，最多 32 個字。"
  rule-not-found: "{prefix}<red>找不到規則 <white>{id}<red>。"
  rule-exists: "{prefix}<red>規則 <white>{id}<red> 已經存在。"
  max-rules: "{prefix}<red>規則數量已達上限（{max} 條）。"
  reloaded: "{prefix}<green>已重新載入設定檔，共 {count} 條規則。"

help:
  header: "<aqua>ItemReplace <gray>v{version}"
  gui: "<yellow>/{label} gui <gray>- 開啟規則介面"
  list: "<yellow>/{label} list <gray>- 列出所有規則"
  create: "<yellow>/{label} create <名稱> <gray>- 建立規則並開啟編輯介面"
  edit: "<yellow>/{label} edit <名稱> <gray>- 編輯規則"
  remove: "<yellow>/{label} remove <名稱> <gray>- 刪除規則"
  toggle: "<yellow>/{label} toggle <名稱> <gray>- 啟用或停用規則"
  reload: "<yellow>/{label} reload <gray>- 重新載入設定檔"
  version: "<yellow>/{label} version <gray>- 檢查更新"
  help: "<yellow>/{label} help <gray>- 顯示這份說明"

list:
  header: "{prefix}<gray>規則列表（共 {count} 條）："
  empty: "{prefix}<gray>目前沒有任何規則。"
  line: "<dark_gray>- <yellow>{id} <dark_gray>| {status} <dark_gray>| <gray>{mode} <dark_gray>| <white>{target} <gray>→ {replacements}"

# 規則狀態與比對方式的名稱（列表與介面共用）
status:
  enabled: "<green>啟用"
  disabled: "<red>停用"
  conflict: "<gold>循環，已暫停"
mode:
  exact: "完全相符"
  material: "只比材質"
replacements:
  none: "<red>無（直接刪除）"
  count: "<white>{count} 種物品"

rule:
  saved: "{prefix}<green>已儲存規則 <white>{id}<green>。"
  removed: "{prefix}<green>已刪除規則 <white>{id}<green>。"
  enabled: "{prefix}<green>已啟用規則 <white>{id}<green>。"
  disabled: "{prefix}<yellow>已停用規則 <white>{id}<yellow>。"
  conflict: "{prefix}<gold>規則 <white>{id}<gold> 換出來的物品會再被規則 <white>{other}<gold> 替換，為了避免無限循環，這條規則已暫停。"
  unsaved: "{prefix}<yellow>規則 <white>{id}<yellow> 的變更尚未儲存，已放棄。"

edit:
  need-target: "{prefix}<red>請先在左邊放入目標物品。"
  need-picked: "{prefix}<red>請先左鍵點你背包裡的物品來選取。"
  item-too-large: "{prefix}<red>這個物品的資料太大（{size} KB，上限 {max} KB），不能放進規則。"
  delete-confirm: "{prefix}<yellow>5 秒內再點一次確認刪除規則 <white>{id}<yellow>。"

update:
  checking: "{prefix}<gray>目前版本 <white>{version}<gray>，正在檢查更新…"
  newer: "{prefix}<yellow>有新版本 <white>{latest}<yellow>（目前 {version}）：<aqua><click:open_url:'{url}'>{url}</click>"
  latest: "{prefix}<green>目前版本 <white>{version}<green> 已是最新。"
  dev: "{prefix}<gray>目前版本 <white>{version}<gray> 比 GitHub 的 <white>{latest}<gray> 新（開發版）。"
  no-release: "{prefix}<gray>目前版本 <white>{version}<gray>，GitHub 尚無發布版本。"
  failed: "{prefix}<red>檢查更新失敗：{reason}"
  reason-http: "HTTP {code}"
  reason-connect: "無法連線到 GitHub"
  reason-invalid: "回應內容無法辨識"
  join-notify: "{prefix}<yellow>有新版本 <white>{latest}<yellow>（目前 {version}）：<aqua><click:open_url:'{url}'>{url}</click>"

gui:
  filler: " "
  list:
    title: "<dark_gray>物品替換規則 <gray>({page}/{pages})"
    rule-name: "<yellow>{id}"
    rule-lore:
      - "<gray>狀態：{status}"
      - "<gray>比對：<white>{mode}"
      - "<gray>目標：<white>{target}"
      - "<gray>替換成：{replacements}"
      - ""
      - "<aqua>左鍵<gray>編輯"
    prev: "<yellow>上一頁"
    next: "<yellow>下一頁"
    create: "<green>新增規則"
    create-lore:
      - "<gray>名稱自動取為 rule-數字"
      - "<gray>要自訂名稱請用 /itemreplace create <名稱>"
    close: "<red>關閉"
    info: "<aqua>說明"
    info-lore:
      - "<gray>每條規則：把「目標」物品換成「替換成」的物品"
      - "<gray>只在物品被碰到時才檢查："
      - "<gray>玩家背包變動、開啟容器、物品掉落、區塊實體載入"
      - "<gray>共 <white>{count}<gray> 條規則"
  edit:
    title: "<dark_gray>編輯規則 <gray>{id}"
    picked-empty: "<gray>尚未選取物品"
    picked-empty-lore:
      - "<gray>1. <aqua>左鍵<gray>點你背包裡的物品來選取"
      - "<gray>2. 再點左邊的目標格，或右邊的替換格放入"
    picked-lore:
      - ""
      - "<yellow>已選取 <white>x{amount}"
      - "<gray>點左邊的目標格，或右邊的替換格放入"
      - "<gray>兩旁的按鈕可以調整數量"
      - "<aqua>左鍵<gray>取消選取"
    amount-minus-10: "<red>-10"
    amount-minus-1: "<red>-1"
    amount-plus-1: "<green>+1"
    amount-plus-10: "<green>+10"
    amount-lore:
      - "<gray>調整已選取物品的數量"
    target-label: "<gold>目標（下面那一格）"
    target-label-lore:
      - "<gray>要被換掉的物品，只能放一個"
      - "<gray>數量固定為 1"
    arrow: "<gold>替換成（右邊 9 格）"
    arrow-lore:
      - "<gray>每 1 個目標會換成右邊全部的物品"
      - "<gray>可以放一個或多個，數量照格子裡的數量"
      - "<gray>全部留空 = 直接刪除目標物品"
    target-lore:
      - ""
      - "<gold>目標物品"
      - "<aqua>左鍵<gray>拿起"
    replacement-lore:
      - ""
      - "<gold>每 1 個目標換成 <white>x{amount}"
      - "<aqua>左鍵<gray>拿起"
    mode: "<aqua>比對方式：<white>{mode}"
    mode-lore:
      - "<gray>完全相符：材質與所有 NBT 都一樣才替換"
      - "<gray>只比材質：不管 NBT，同材質就替換"
      - "<gray>（只比材質時，已經是替換結果的物品不會再換）"
      - ""
      - "<aqua>左鍵<gray>切換"
    enabled-on: "<green>規則：啟用"
    enabled-off: "<red>規則：停用"
    enabled-lore:
      - "<aqua>左鍵<gray>切換"
    save: "<green>儲存"
    save-lore:
      - "<gray>沒有需要儲存的變更"
    save-dirty: "<green>儲存 <yellow>（有未儲存的變更）"
    save-dirty-lore:
      - "<aqua>左鍵<gray>儲存，規則立即生效"
    delete: "<red>刪除規則"
    delete-lore:
      - "<aqua>左鍵<gray>點兩下刪除（5 秒內）"
    delete-armed: "<dark_red>再點一次確認刪除"
    back: "<yellow>返回列表"
    back-lore:
      - "<gray>未儲存的變更會被放棄"
    info: "<aqua>說明"
    info-lore:
      - "<gray>左邊放目標，右邊放要替換成的物品"
      - "<gray>所有操作都用左鍵，物品只會被複製，不會被拿走"
      - "<gray>狀態：{status}"

# 後台訊息
console:
  loaded: "已載入 {count} 條規則（生效 {active} 條）。"
  rule-load-failed: "規則 {id} 讀取失敗，已略過（原檔備份為 {backup}）：{reason}"
  rule-conflict: "規則 {id} 換出來的物品會再被規則 {other} 替換，已暫停。"
  save-failed: "{file} 寫入失敗：{reason}"
  discarded: "有 {count} 個替換後放不下的物品被捨棄（規則 {id}）。"
  log-full: "今天的替換紀錄檔已達 {max} MB，之後的紀錄不再寫入。"
  log-dropped: "替換紀錄太多，有 {count} 筆來不及寫入而被略過。"
  log-line: "替換：規則 {rule}｜{where}｜玩家 {player}｜{world} {x},{y},{z}｜數量 {amount}"

# 替換紀錄檔（純文字，不支援顏色）
log-file:
  line: "[{time}] 規則={rule} 位置={where} 玩家={player} 世界={world} 座標={x},{y},{z} 數量={amount}"
  no-player: "-"
  where:
    player: "玩家身上"
    container: "容器"
    ground: "掉落物"
    item-frame: "物品展示框"
    armor-stand: "盔甲座"
    item-display: "物品展示實體"
