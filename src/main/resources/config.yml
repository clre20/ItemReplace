# ItemReplace 設定檔
# 缺少的項目會在啟動與 /itemreplace reload 時自動補齊，原本的設定值會保留。

# 觸發時機（全部都是被動檢查，不會主動掃描世界）
triggers:
  # 玩家身上（背包、裝備、副手）：登入時，以及背包格子有變動時
  player-inventory: true
  # 玩家開啟容器時（箱子、木桶、界伏盒、漏斗、終界箱、礦車、驢子等）
  container-open: true
  # 物品掉到地上時（丟出、方塊掉落、死亡掉落、發射器等）
  item-spawn: true
  # 區塊的實體載入時（地上的掉落物、物品展示框、盔甲座、物品展示實體）
  entities-load: true

# 物品裡面的物品（界伏盒、束口袋等）
nested:
  enabled: true
  # 最多往內檢查幾層（1～5）
  max-depth: 3

# 替換後放不下的物品
overflow:
  # DROP = 掉在地上；DISCARD = 直接捨棄
  mode: DROP
  # 單次替換最多掉落幾組，超過的直接捨棄（避免大量掉落物造成卡頓）
  max-drops: 64

# 上限
limits:
  # 規則數量上限
  max-rules: 500
  # 單一物品資料大小上限（KB），超過的物品不能放進規則
  max-item-size-kb: 256

# 替換紀錄（寫在 plugins/ItemReplace/logs/replace-日期.log）
log:
  enabled: true
  # 是否同時顯示在後台
  console: false
  # 每隔幾秒把紀錄寫入檔案一次
  flush-interval-seconds: 10
  # 紀錄檔保留天數
  retention-days: 14
  # 單一紀錄檔大小上限（MB），超過後當天不再寫入
  max-file-size-mb: 10

# 規則存檔
storage:
  # 規則有變動時，每隔幾秒寫入 rules.yml 一次（關服與重載時一定會寫入）
  save-interval-seconds: 10

# 檢查更新
update-checker:
  # 伺服器啟動時檢查一次
  check-on-startup: true
  # 有新版本時，提醒有 itemreplace.version 權限的玩家（登入 3 秒後）
  notify-on-join: true
